<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>울산대 숨길</title>
<meta name="description" content="울산대 캠퍼스 담배연기 실시간 신고 지도. 친구들이랑 같이 걷고, 연기 나는 곳은 피해 가요.">
<meta name="theme-color" content="#e9f5f1">
<meta property="og:type" content="website">
<meta property="og:title" content="울산대 숨길">
<meta property="og:description" content="얘들아 여기 연기! 울산대 캠퍼스 담배연기 실시간 신고 지도">
<meta property="og:image" content="og.png">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}.foot a{color:inherit}</style>
</head>
<body>
<style>
/* Layout: pastel 2.5D campus world fills the stage; chunky toy-like control rail on the right (bottom sheet on phones).
   Deliberately single-look (sunny pastel day) so the world reads the same everywhere. */
:root{
  --bg:#e9f5f1; --panel:#ffffff; --card:#f7f4ff; --ink:#3b3355; --muted:#857d9e; --line:#e7e2f5;
  --accent:#7c6cf0; --accent-d:#5b4bd1; --pink:#ff8fb1; --pink-d:#e46a90;
  --smoke:#77718a; --smoke-d:#56506a; --crowd:#ffad42; --crowd-d:#e48a14; --ok:#33bf86; --ok-d:#1f9a69; --alert:#ff6f7d;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:2px solid var(--line)}
.logo{width:34px;height:34px;flex:none}
.brand{font-family:var(--f-display);font-size:25px;line-height:1;color:var(--accent-d)}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:8px}
.live{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:12px;font-weight:700;color:var(--ink);background:var(--card);padding:6px 11px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}}
.stage{position:relative;min-width:0;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.toast{position:absolute;z-index:5;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  padding:9px 16px;border-radius:999px;font-family:var(--f-display);font-size:15px;pointer-events:none;box-shadow:0 4px 0 rgba(59,51,85,.15)}
#toast{top:12px;background:var(--panel);color:var(--smoke-d);border:2px solid var(--smoke)}
#alert{top:58px;background:var(--alert);color:#fff;animation:pop .35s}
@keyframes pop{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}
.mapbtns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.mapbtns button,.hint{background:var(--panel);border:2px solid var(--line);color:var(--ink);font-family:var(--f-display);font-size:13px;padding:6px 12px;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.hint{position:absolute;left:12px;bottom:12px;cursor:default;color:var(--muted);font-family:var(--f-body);font-size:12px}
aside{background:var(--panel);border-left:2px solid var(--line);overflow-y:auto;min-width:0;
  padding-block:14px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:12px}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 span{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
.chip{font-family:var(--f-display);font-size:14px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent-d)}
.toy{font-family:var(--f-display);border:0;cursor:pointer;border-radius:16px;transition:transform .08s}
.toy:active{transform:translateY(3px)}
.sos{width:100%;font-size:23px;padding:14px 12px 12px;background:var(--smoke);color:#fff;box-shadow:0 5px 0 var(--smoke-d);display:flex;align-items:center;justify-content:center;gap:10px}
.sos:active{box-shadow:0 2px 0 var(--smoke-d)}
.sos small{display:block;font-family:var(--f-body);font-size:12px;opacity:.9;margin-top:2px}
.sos svg{width:46px;height:34px;flex:none}
.btn{flex:1;font-size:15px;padding:10px;color:#fff}
.btn.k{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.c{background:var(--crowd);box-shadow:0 4px 0 var(--crowd-d)}
.btn:active{box-shadow:none}
.emo{flex:1;min-width:40px;font-size:22px;padding:6px 0;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
button:focus-visible,input:focus-visible,li:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.zones{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.zones li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:8px 10px;background:var(--panel);border-radius:12px;cursor:pointer}
.zones li:hover{background:#fff8e6}
.zname{font-family:var(--f-display);font-size:15px}
.zmeta{grid-column:1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-display);font-size:13px;padding:4px 10px;border-radius:999px}
.pill.ok{color:var(--ok-d);background:#dcf6ea}
.pill.crowd{color:var(--crowd-d);background:#fff0d9}
.pill.smoke{color:#fff;background:var(--smoke)}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;margin-top:auto}
.foot label{display:flex;gap:6px;align-items:center;cursor:pointer}
.more{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  header{padding-block:7px}.brand{font-size:21px}.logo{width:28px;height:28px}
  aside{border-left:0;border-top:2px solid var(--line);max-height:62vh;padding-block:10px;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  aside:not(.open)>section:not(:first-child),aside:not(.open)>.foot,aside:not(.open) #repMsg{display:none}
  .sos{font-size:19px;padding:9px 10px 8px}.sos svg{width:36px;height:27px}.btn{font-size:14px;padding:8px}
  .more{display:block;width:100%;margin-top:8px;font-family:var(--f-display);font-size:13px;color:var(--muted);background:none;border:0;padding:2px;cursor:pointer}
  .brand small,.hint{display:none}
  body.in3 aside{display:none}
}
@media (prefers-reduced-motion:reduce){.dot.on,#alert{animation:none}}
/* 3D building view */
#view3{position:absolute;inset:0;background:#bfe6ff;opacity:0;transition:opacity .35s}
#view3.show{opacity:1}
#cv3{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nt{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.nt b{font-family:var(--f-display);font-weight:400;font-size:13px;background:rgba(255,255,255,.92);color:var(--ink);padding:3px 10px 3px 8px;border-radius:999px;display:flex;align-items:center;gap:5px;box-shadow:0 2px 0 rgba(59,51,85,.12)}
.nt b i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nt b em{font-style:normal;font-size:10px;background:var(--accent);color:#fff;border-radius:999px;padding:0 5px}
.nt.ex b{border:1.5px dashed #b7b0cc}
.nt.me b{background:var(--accent);color:#fff}
.nt span{font-family:var(--f-body);font-size:13px;background:#fff;color:var(--ink);padding:5px 10px;border-radius:12px;box-shadow:0 2px 0 rgba(59,51,85,.12)}
.nt span.big{font-size:22px;padding:2px 8px;border-radius:50%}
.nt span.ouch{font-family:var(--f-display);background:var(--alert);color:#fff}
.roombar{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);padding:6px 14px 6px 6px;border-radius:999px;box-shadow:0 3px 0 rgba(59,51,85,.12);max-width:calc(100% - 24px)}
.roombar button{font-family:var(--f-display);font-size:14px;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}
.roombar strong{font-family:var(--f-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roombar small{font-size:12px;color:var(--muted);white-space:nowrap}
.hint3{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);background:rgba(255,255,255,.75);padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.actbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(59,51,85,.55);backdrop-filter:blur(8px);padding:6px;border-radius:20px;max-width:calc(100% - 24px);overflow-x:auto}
.actbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;border:0;background:transparent;color:#fff;font-family:var(--f-display);font-size:13px;padding:6px 6px;border-radius:14px;cursor:pointer}
.actbar button span{font-size:22px;line-height:1}
.actbar button:hover{background:rgba(255,255,255,.15)}
.pop{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 0 rgba(59,51,85,.15),0 10px 30px rgba(59,51,85,.2)}
.pop strong{font-family:var(--f-display);font-weight:400;font-size:14px;text-align:center;padding:2px 0 4px}
.pop .row{gap:4px}
.pop button{font-family:var(--f-display);font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 8px;cursor:pointer}
.pop button:hover{border-color:var(--accent)}
@media (max-width:760px){.actbar{bottom:10px;padding:4px;gap:0;border-radius:16px}.actbar button{min-width:46px;font-size:10px;white-space:nowrap;padding:5px 3px}.actbar button span{font-size:19px}.hint3{display:none}.nt b{font-size:11px;padding:2px 8px 2px 6px}.nt b em{display:none}.roombar{padding:4px 12px 4px 4px;gap:7px}.roombar strong{font-size:15px}.roombar button{font-size:13px;padding:6px 10px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>

<div class="app">
  <header>
    <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#bfe8b8"/><path d="M9 20a5 5 0 0 1 2-9 6 6 0 0 1 11 0 5 5 0 0 1 3 9z" fill="#fff"/><circle cx="14" cy="16" r="1.4" fill="#3b3355"/><circle cx="20" cy="16" r="1.4" fill="#3b3355"/><path d="M15 18.5q2 1.6 4 0" stroke="#3b3355" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="12" cy="18" r="1.3" fill="#ff8fb1" opacity=".7"/><circle cx="22" cy="18" r="1.3" fill="#ff8fb1" opacity=".7"/></svg>
    <div class="brand">울산대 숨길<small>연기 피해서 같이 걷는 캠퍼스</small></div>
    <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">혼자 산책 중</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="울산대학교 캠퍼스 월드. 방향키나 탭으로 이동, 스페이스로 점프"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="toast" id="alert" hidden></div>
    <div class="hint">건물을 누르면 안으로 들어가요 · 길을 누르면 걸어가요 · 스페이스 점프</div>
    <div class="mapbtns"><button id="fitBtn" type="button">전체 보기</button></div>
    <div id="view3" hidden>
      <canvas id="cv3" aria-label="건물 앞마당 3D 뷰. 바닥을 눌러 이동, 드래그로 둘러보기, 친구를 눌러 상호작용"></canvas>
      <div id="labels"></div>
      <div class="roombar"><button id="exit3" type="button">← 지도로</button><strong id="room3"></strong><small id="cnt3"></small></div>
      <div class="hint3">바닥 클릭 이동 · 드래그로 둘러보기 · 휠 확대/축소 · 친구를 누르면 인사·뿅망치</div>
      <div class="actbar" id="actbar"></div>
      <div class="pop" id="pop" hidden></div>
    </div>
  </div>
  <aside>
    <section>
      <button class="toy sos" id="repSmoke" type="button">
        <svg viewBox="0 0 46 34" aria-hidden="true"><path d="M8 28a7 7 0 0 1 2-13 9 9 0 0 1 17-3 7 7 0 0 1 11 6 6 6 0 0 1-1 10z" fill="#fff"/><path d="M17 16l4 2M29 16l-4 2" stroke="#56506a" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="20" r="1.6" fill="#56506a"/><circle cx="27" cy="20" r="1.6" fill="#56506a"/><path d="M20 25q3-2 6 0" stroke="#56506a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <span>얘들아 여기 연기!<small>내 위치에 신고 · 10분 동안 둥둥</small></span>
      </button>
      <div class="row" style="margin-top:10px">
        <button class="toy btn k" id="repClear" type="button">연기 사라졌어</button>
        <button class="toy btn c" id="repCrowd" type="button">여기 북적북적</button>
      </div>
      <p class="note" id="repMsg">신고하면 접속한 친구들 화면에 바로 알림이 떠요.</p>
      <button class="more" id="more" type="button" aria-expanded="false">감정표현 · 캠퍼스 상황 · 꾸미기 ▲</button>
    </section>
    <section class="card">
      <h2>감정표현 <span>키보드 1~6</span></h2>
      <div class="row" id="emos"></div>
      <form id="sayForm" style="margin-top:8px"><input type="text" id="say" maxlength="30" placeholder="말풍선: 신관 3층 자리 있어요" aria-label="말풍선 내용"></form>
    </section>
    <section class="card">
      <h2>캠퍼스 상황 <span>누르면 거기로 걸어가요</span></h2>
      <ul class="zones" id="zones"></ul>
    </section>
    <section class="card">
      <h2>내 캐릭터</h2>
      <input type="text" id="nick" maxlength="10" aria-label="닉네임">
      <div class="row" style="margin-top:10px" id="swatches" aria-label="옷 색"></div>
      <div class="row" style="margin-top:10px" id="accs" aria-label="머리 장식"></div>
      <div class="row" style="margin-top:10px" id="stChips">
        <button class="chip" data-st="walk" aria-pressed="true" type="button">산책</button>
        <button class="chip" data-st="study" aria-pressed="false" type="button">공부 중</button>
        <button class="chip" data-st="rest" aria-pressed="false" type="button">쉬는 중</button>
        <button class="chip" data-st="eat" aria-pressed="false" type="button">밥 먹는 중</button>
      </div>
    </section>
    <div class="foot">
      <label><input type="checkbox" id="npcT"> 예시 친구·예시 신고 보기 <span id="npcInfo"></span></label>
      <span>실제 GPS는 쓰지 않아요. 지도 속 내 아바타 위치와 닉네임만 접속자끼리 보여요. 신고는 30분 뒤 안 보이게 돼요.</span>
      <span>건물·길: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap 기여자</a> (ODbL)</span>
    </div>
  </aside>
</div>

<script>
(()=>{

  if(ht<1){sy=1-.38*Math.exp(-ht*5)*Math.cos(ht*24);tilt=Math.sin(ht*22)*.25*(1-ht)}
  av.stars.visible=ht<1;av.stars.rotation.y=now/180;
  av.arms[0].rotation.set(lax,0,laz);av.arms[1].rotation.set(rax,0,raz);av.ham.visible=ham;
  av.up.rotation.x=lean;av.up.position.y=.42+bob;av.head.rotation.z=tilt;
  const jt=e.jAt?(Date.now()-e.jAt)/520:2;
  av.g.position.set(e.x,jt<1?Math.sin(jt*Math.PI)*.9:0,e.z);av.g.rotation.y=e.yaw+spin;av.g.scale.set(1+(1-sy)*.5,sy,1+(1-sy)*.5);
}
const _v=()=>new THREE.Vector3();
function label3(e){const v=_v().set(e.x,2.2+(e.av.g.position.y),e.z).project(cam3);
  if(v.z>1||Math.abs(v.x)>1.2||Math.abs(v.y)>1.2){e.label.style.display="none";return}
  e.label.style.display="";e.label.style.left=((v.x+1)/2*cv3.clientWidth)+"px";e.label.style.top=((1-v.y)/2*cv3.clientHeight)+"px";
  const nw=Date.now();let bub="";
  if(e.ouchAt&&nw-e.ouchAt<1500)bub='<span class="ouch">아야!</span>';else if(e.say&&nw-e.sayAt<6000)bub=`<span>${esc(e.say)}</span>`;else if(e.emo&&nw-e.emoAt<2600)bub=`<span class="big">${esc(e.emo)}</span>`;
  const st={study:"공부",rest:"휴식",eat:"냠냠"}[e.st]||"";
  const html=bub+`<b><i style="background:${COLS[e.col]}"></i>${e.me?"나 · ":""}${esc(e.nick)}${st?`<em>${st}</em>`:""}</b>`;
  if(html!==e.lastTag){e.label.innerHTML=html;e.lastTag=html}}
function update3(dt,act){
  const now=performance.now();myPeerId=myPeer();let m=R3.me;
  if(m.col!==me.col||m.acc!==me.acc){const o={x:m.x,z:m.z,yaw:m.yaw};dropEnt(m);m=R3.me=makeEnt({me:1,key:"me",nick,col:me.col,acc:me.acc,...o});R3.ents[0]=m}
  Object.assign(m,{nick,say:me.say,sayAt:me.sayAt,emo:me.emo,emoAt:me.emoAt,st:me.st,jAt:me.jAt});
  if(R3.kx||R3.ky){const s=Math.sin(orbit.yaw),c=Math.cos(orbit.yaw);const vx=c*R3.kx-s*(-R3.ky),vz=-s*R3.kx-c*(-R3.ky);m.tx=m.x+vx*.6;m.tz=m.z+vz*.6;R3.pending=null}
  if(R3.pending){const {k,t}=R3.pending;if(!allEnts().includes(t))R3.pending=null;else if(Math.hypot(t.x-m.x,t.z-m.z)<1.9||Math.hypot(m.tx-m.x,m.tz-m.z)<.08){R3.pending=null;perform(m,k,t.key,true)}}
  const seen=new Set();
  for(const p of peers){if(p.sameTab||p.kind!=="viewer")continue;const q=p.presence||{};if(q.in!==R3.name)continue;seen.add(p.peer);
    let e=R3.peerE.get(p.peer);const col=(+q.col|0)%8,acc=(+q.acc|0)%6;
    if(e&&(e.col!==col||e.acc!==acc)){dropEnt(e);R3.peerE.delete(p.peer);e=null}
    const px=+q.px||0,pz=+q.pz||0;
    if(!e){e=makeEnt({key:p.peer,nick:"",col,acc,x:px,z:pz,yaw:+q.ry||0});R3.peerE.set(p.peer,e)}
    Object.assign(e,{nick:String(q.nick||"익명").slice(0,10),tx:px,tz:pz,ryT:+q.ry||0,say:String(q.say||"").slice(0,30),sayAt:+q.sayAt||0,emo:EMOS.includes(q.emo)?q.emo:"",emoAt:+q.emoAt||0,st:String(q.st||""),jAt:+q.jAt||0});
    const a=q.act;if(a&&typeof a==="object"&&+a.at>(R3.seenAct.get(p.peer)||0)){R3.seenAct.set(p.peer,+a.at);if(Date.now()-a.at<4000&&ACTK.includes(a.t))perform(e,a.t,typeof a.to==="string"?a.to:null,false)}}
  for(const [k,e] of R3.peerE)if(!seen.has(k)){dropEnt(e);R3.peerE.delete(k)}
  for(const e of R3.ents)if(e.npc&&!e.act){e.wait-=dt;if(e.wait<0){e.wait=2+Math.random()*4;
    if(Math.random()<.5&&e.st!=="study"){const a=Math.random()*6.28,r=2+Math.random()*6;e.tx=Math.cos(a)*r;e.tz=Math.sin(a)*r*.7-1}
    else if(Math.random()<.35){e.emo=EMOS[(Math.random()*6)|0];e.emoAt=Date.now()}else if(Math.random()<.15)perform(e,["dance","wave","heart"][(Math.random()*3)|0],null,false)}}
  for(const e of allEnts())animEnt(e,dt,now);
  let smokeNear=false;
  for(const s of R3.smokes){s.position.y=2.4+Math.sin(now/500+s.position.x)*.2;s.rotation.y=Math.sin(now/1300+s.position.x)*.35;if(Math.random()<.1)puff3(s.position);
    if(Math.hypot(m.x-s.position.x,m.z-s.position.z)<4)smokeNear=true}
  const tE=$("toast");if(smokeNear){tE.textContent="콜록콜록! 연기 구름 근처예요 · 멀리 떨어져요";tE.hidden=false}else tE.hidden=true;
  for(let i=R3.fx.length-1;i>=0;i--){const f=R3.fx[i];f.l+=dt;const k=f.l/f.L;if(k>=1){sc3.remove(f.o);if(f.o.material){if(f.o.material.map)f.o.material.map.dispose();f.o.material.dispose()}if(f.o.geometry)f.o.geometry.dispose();R3.fx.splice(i,1);continue}
    if(f.t==="up"){f.o.position.y+=f.vy*dt;f.o.material.opacity=1-k*k;f.o.material.rotation=Math.sin(f.l*10)*.1*(1-k)}
    else if(f.t==="ring"){const s=1+k*2;f.o.scale.set(s,s,s);f.o.material.opacity=1-k}
    else if(f.t==="puff"){f.o.position.y+=f.vy*dt;const s=1+k*2;f.o.scale.set(s,s,s);f.o.material.opacity=.45*(1-k)}}
  const cp=Math.cos(orbit.pitch),tg=_v().set(m.x,1.1,m.z);
  cam3.position.lerp(_v().set(m.x+Math.sin(orbit.yaw)*cp*orbit.dist,1.1+Math.sin(orbit.pitch)*orbit.dist,m.z+Math.cos(orbit.yaw)*cp*orbit.dist),.15);cam3.lookAt(tg);
  rd.render(sc3,cam3);
  for(const e of allEnts())label3(e);
  const n=allEnts().length;$("cnt3").textContent=`${n}명 모여 있어요`+(R3.nearSmoke?` · 연기 신고 ${R3.nearSmoke}`:"");
  if(m.mv&&now-lastP>80){lastP=now;pushP()}
}

const DIRS=["동","남동","남","남서","서","북서","북","북동"];
function warn(act){if(R3.on)return;let best=null,bd=1e9;for(const s of act){if(s.kind!=="smoke")continue;const d=Math.hypot(me.x-s.x,me.y-s.y);if(d<SMOKE_R+40&&d<bd){bd=d;best=s}}
  const el=$("toast");if(!best){el.hidden=true;return}
  const i=((Math.round(Math.atan2(me.y-best.y,me.x-best.x)/(Math.PI/4))%8)+8)%8;
  el.textContent=bd<SMOKE_R?`콜록콜록! 연기 속이에요 · ${DIRS[i]}쪽으로 피해요`:`앗 근처에 연기 · ${DIRS[i]}쪽이 맑아요`;el.hidden=false}
let last=performance.now(),zoneTick=0,dustT=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(R3.on){R3.kx=vx;R3.ky=vy;vx=vy=0;me.tx=null}
  if(!vx&&!vy&&me.tx!=null){const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);if(d<4)me.tx=null;else{vx=dx/d;vy=dy/d}}
  me.mv=0;
  if(vx||vy){const m=Math.hypot(vx,vy),s=170*dt,ox=me.x,oy=me.y;
    if(!moveTo(me,me.x+vx/m*s,me.y+vy/m*s)&&me.tx!=null)me.tx=null;
    const d=Math.hypot(me.x-ox,me.y-oy);if(d>0){me.mv=1;me.walk+=d;if(Math.abs(me.x-ox)>.05)me.face=Math.sign(me.x-ox);
      if(t-dustT>140){dustT=t;fx.push({t:"dust",x:me.x-me.face*5,y:me.y+10,l:0,L:.5})}
      if(t-lastP>60){lastP=t;pushP()}}}
  if($("npcT").checked)for(const n of NPC)stepNPC(n,dt);
  const all=everyone(),act=activeReports();
  if(R3.on)update3(dt,act);else draw(all,act,t);
  if(t-zoneTick>700){zoneTick=t;renderZones(all,act);warn(act);if(alertT&&Date.now()-alertT>6000){$("alert").hidden=true;alertT=0}}
  requestAnimationFrame(loop);
}
$("npcT").addEventListener("change",()=>{zoneTick=0});
requestAnimationFrame(loop);
})();
</script>
